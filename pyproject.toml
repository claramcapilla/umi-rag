
[project]
name = "umi-rag"
version = "0.1.0"
description = "Sistema RAG con procesamiento documental clínico"
requires-python = ">=3.12,<3.13"

dependencies = [
    "django>=5.0,<6",
    "httpx>=0.27,<1",
    "openai>=1.0,<2",
    "opendataloader-pdf>=2.0.0,<3",
    "pikepdf>=9,<10",
    "requests>=2.31,<3",
    "tiktoken>=0.7,<1",
]

[project.optional-dependencies]
indexing = [
    "numpy",
    "qdrant-client",
    "langchain-huggingface",
    "sentence-transformers",
    "torch",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pyright]
extraPaths = ["src", "web"]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "chatbot*",
    "document_processor*",
    "generation*",
    "indexing*",
    "rag*",
    "retrieval*",
]
