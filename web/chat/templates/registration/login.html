<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceder al asistente clínico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --slate: #0e1116; --well: #161b21; --line: #262d37;
      --text: #dde4ec; --muted: #8c99a8; --teal: #74bdb0; --danger: #e8958c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--slate); color: var(--text);
      font: 400 17px/1.6 "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    form { width: min(340px, 100%); }
    h1 { font-size: 24px; font-weight: 600; line-height: 1.3; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 28px; font-size: 15px; }
    label { display: block; font-size: 15px; color: var(--muted); margin: 0 0 6px; }
    input {
      display: block; width: 100%; margin: 0 0 18px; padding: 10px 12px; font: inherit; color: inherit;
      background: var(--well); border: 1px solid var(--line); border-radius: 6px;
    }
    input:focus-visible { outline: none; border-color: var(--teal); }
    button {
      width: 100%; height: 46px; margin-top: 6px; border: 0; border-radius: 6px; cursor: pointer;
      font: inherit; font-weight: 600; background: var(--teal); color: #10201d;
    }
    button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    .error { color: var(--danger); font-size: 15px; margin: 0 0 18px; padding-left: 12px; border-left: 2px solid var(--danger); }
  </style>
</head>
<body>
  <form method="post">
    {% csrf_token %}
    <h1>Asistente clínico</h1>
    <p class="sub">Inicia sesión con la cuenta que te ha dado el equipo.</p>
    {% if form.errors %}<p class="error">El usuario o la contraseña no son correctos.</p>{% endif %}
    <label for="id_username">Usuario</label>
    <input id="id_username" name="username" autocomplete="username" required autofocus>
    <label for="id_password">Contraseña</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Iniciar sesión</button>
  </form>
</body>
</html>
